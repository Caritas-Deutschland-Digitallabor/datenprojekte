name: Monthly Project Scraper

on:
  schedule:
    # Runs at 10:55 UTC on the 5th of every month
    - cron: '55 10 5 * *'
  workflow_dispatch: # Allows you to run it manually for testing

# Necessary permissions to create branches and PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraping script
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 
        run: python project_code/monthly_pipeline.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update: Scraped data and Obsidian vault $(date +%Y-%m-%d)" || exit 0
          git push